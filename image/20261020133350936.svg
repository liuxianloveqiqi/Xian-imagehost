<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="472" viewBox="0 0 1280 472">
 <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2376C7" stroke-width="2.5"/></marker></defs>
 <rect width="1280" height="472" fill="#F6F9FC"/><rect x="54" y="51" width="9" height="57" rx="4" fill="#2376C7"/><text x="82" y="94" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" font-weight="700" fill="#182D44" text-anchor="start">点击“添加”之后发生了什么？</text><text x="82" y="135" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#476178" text-anchor="start">任务不是只停在页面上：它会保存到文件</text><rect x="70" y="179" width="361" height="106" rx="18" fill="#EAF4FF" stroke="#DAE4ED" stroke-width="2" /><text x="88" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">01  输入标题日期</text><text x="88" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">标题不能为空</text><line x1="434" y1="231" x2="454" y2="231" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="459" y="179" width="361" height="106" rx="18" fill="#EAF8F4" stroke="#DAE4ED" stroke-width="2" /><text x="477" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">02  程序检查输入</text><text x="477" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">日期需 YYYY-MM-DD</text><line x1="823" y1="231" x2="843" y2="231" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="848" y="179" width="361" height="106" rx="18" fill="#FFF3E3" stroke="#DAE4ED" stroke-width="2" /><text x="866" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">03  保存 JSON</text><text x="866" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">data/tasks.json</text><line x1="1028" y1="288" x2="1028" y2="314" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="325" width="361" height="106" rx="18" fill="#EAF4FF" stroke="#DAE4ED" stroke-width="2" /><text x="88" y="367" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">04  刷新列表</text><text x="88" y="401" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">看到新增一行</text><line x1="434" y1="377" x2="454" y2="377" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="459" y="325" width="361" height="106" rx="18" fill="#EAF8F4" stroke="#DAE4ED" stroke-width="2" /><text x="477" y="367" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">05  重新打开恢复</text><text x="477" y="401" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">从同一文件读取</text><text x="1218" y="448" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#476178" text-anchor="end">工作流程示意 · 非真实软件截图</text></svg>