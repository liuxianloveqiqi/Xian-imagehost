<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="472" viewBox="0 0 1280 472">
 <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2376C7" stroke-width="2.5"/></marker></defs>
 <rect width="1280" height="472" fill="#F6F9FC"/><rect x="54" y="51" width="9" height="57" rx="4" fill="#2376C7"/><text x="82" y="94" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" font-weight="700" fill="#182D44" text-anchor="start">和 Codex 协作，先把任务说清楚</text><text x="82" y="135" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#476178" text-anchor="start">每轮只提出一小组功能，不要一次做 20 件事</text><rect x="70" y="179" width="556" height="106" rx="18" fill="#EAF4FF" stroke="#DAE4ED" stroke-width="2" /><text x="88" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">01  参考谁</text><text x="88" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">给官方教程链接</text><line x1="629" y1="231" x2="649" y2="231" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="654" y="179" width="556" height="106" rx="18" fill="#EAF8F4" stroke="#DAE4ED" stroke-width="2" /><text x="672" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">02  要做什么</text><text x="672" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">列出明确功能</text><line x1="932" y1="288" x2="932" y2="314" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="325" width="556" height="106" rx="18" fill="#FFF3E3" stroke="#DAE4ED" stroke-width="2" /><text x="88" y="367" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">03  不要做什么</text><text x="88" y="401" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">禁止复杂依赖</text><line x1="629" y1="377" x2="649" y2="377" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="654" y="325" width="556" height="106" rx="18" fill="#EAF4FF" stroke="#DAE4ED" stroke-width="2" /><text x="672" y="367" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">04  怎么确认完成</text><text x="672" y="401" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">运行、检查、反馈</text><text x="1218" y="448" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#476178" text-anchor="end">工作流程示意 · 非真实软件截图</text></svg>