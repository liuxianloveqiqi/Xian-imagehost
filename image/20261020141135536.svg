 <rect width="1280" height="472" fill="#F6F9FC"/><rect x="54" y="51" width="9" height="57" rx="4" fill="#2376C7"/><text x="82" y="94" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" font-weight="700" fill="#182D44" text-anchor="start">第一次运行前，只检查这几项</text><text x="82" y="135" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#476178" text-anchor="start">基础版不需要大模型 API；高级版还需语音服务</text><rect x="70" y="179" width="361" height="106" rx="18" fill="#EAF4FF" stroke="#DAE4ED" stroke-width="2" /><text x="88" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">01  Codex 可用</text><text x="88" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">能打开一个项目</text><line x1="434" y1="231" x2="454" y2="231" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="459" y="179" width="361" height="106" rx="18" fill="#EAF8F4" stroke="#DAE4ED" stroke-width="2" /><text x="477" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">02  Python 3.10+</text><text x="477" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">Windows: py --version</text><line x1="823" y1="231" x2="843" y2="231" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="848" y="179" width="361" height="106" rx="18" fill="#FFF3E3" stroke="#DAE4ED" stroke-width="2" /><text x="866" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">03  Flet 1.x</text><text x="866" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">选择适配版本</text><line x1="1028" y1="288" x2="1028" y2="314" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="325" width="361" height="106" rx="18" fill="#EAF4FF" stroke="#DAE4ED" stroke-width="2" /><text x="88" y="367" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">04  练习文件夹</text><text x="88" y="401" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">避免改错目录</text><line x1="434" y1="377" x2="454" y2="377" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="459" y="325" width="361" height="106" rx="18" fill="#EAF8F4" stroke="#DAE4ED" stroke-width="2" /><text x="477" y="367" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">05  Qwen 官方安装包</text><text x="477" y="401" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">GitHub Releases</text><line x1="823" y1="377" x2="843" y2="377" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="848" y="325" width="361" height="106" rx="18" fill="#FFF3E3" stroke="#DAE4ED" stroke-width="2" /><text x="866" y="367" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">06  麦克风与 API Key</text><text x="866" y="401" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">检查套餐和额度</text><text x="1218" y="448" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#476178" text-anchor="end">工作流程示意 · 非真实软件截图</text></svg>