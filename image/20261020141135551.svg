<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="472" viewBox="0 0 1280 472">
 <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2376C7" stroke-width="2.5"/></marker></defs>
 <rect width="1280" height="472" fill="#F6F9FC"/><rect x="54" y="51" width="9" height="57" rx="4" fill="#2376C7"/><text x="82" y="94" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" font-weight="700" fill="#182D44" text-anchor="start">“你好千问”是怎么唤醒助手的？</text><text x="82" y="135" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#476178" text-anchor="start">唤醒词检测在本地；语音对话仍由配置的语音前台处理</text><rect x="70" y="179" width="361" height="106" rx="18" fill="#EAF4FF" stroke="#DAE4ED" stroke-width="2" /><text x="88" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">01  桌面端休眠</text><text x="88" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">保持对应唤醒条件</text><line x1="434" y1="231" x2="454" y2="231" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="459" y="179" width="361" height="106" rx="18" fill="#EAF8F4" stroke="#DAE4ED" stroke-width="2" /><text x="477" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">02  本地检测唤醒词</text><text x="477" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">首次约 33 MB 模型</text><line x1="823" y1="231" x2="843" y2="231" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="848" y="179" width="361" height="106" rx="18" fill="#FFF3E3" stroke="#DAE4ED" stroke-width="2" /><text x="866" y="221" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">03  识别“你好千问”</text><text x="866" y="255" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">不是远程语音识别</text><line x1="1028" y1="288" x2="1028" y2="314" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="325" width="361" height="106" rx="18" fill="#EAF4FF" stroke="#DAE4ED" stroke-width="2" /><text x="88" y="367" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">04  恢复语音对话</text><text x="88" y="401" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">恢复输入输出</text><line x1="434" y1="377" x2="454" y2="377" stroke="#2376C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="459" y="325" width="361" height="106" rx="18" fill="#EAF8F4" stroke="#DAE4ED" stroke-width="2" /><text x="477" y="367" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#182D44" text-anchor="start">05  正常交互</text><text x="477" y="401" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#476178" text-anchor="start">询问明天日程</text><text x="1218" y="448" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#476178" text-anchor="end">工作流程示意 · 非真实软件截图</text></svg>